<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行車距離記錄</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; padding-bottom: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #1e3a8a; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; -webkit-appearance: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-secondary { background-color: #475569; color: white; }
        .btn-danger { background-color: #dc2626; color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; width: auto; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background-color: #f1f5f9; }
        
        /* 右下角版本編號樣式 */
        .version-tag {
            position: fixed;
            bottom: 8px;
            right: 8px;
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 6px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-family: monospace;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚗 行車里數記錄本</h1>
    
    <div class="card">
        <form id="mileageForm">
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="driveDate" required>
            </div>
            <div class="form-group">
                <label>開始里數 (km) <span style="font-weight:normal; font-size:12px; color:#64748b;">(選填)</span></label>
                <input type="number" id="startMileage" placeholder="例如: 120500" step="0.1">
            </div>
            <div class="form-group">
                <label>完結里數 (km) <span style="font-weight:normal; font-size:12px; color:#64748b;">(選填)</span></label>
                <input type="number" id="endMileage" placeholder="例如: 120545" step="0.1">
            </div>
            <div class="form-group">
                <label>總行車距離 (km)</label>
                <input type="number" id="totalDistance" placeholder="可自動計算，或直接輸入距離" step="0.1" required style="border-color: #16a34a; font-weight: bold; color: #16a34a;">
            </div>
            <div class="form-group">
                <label>長車原因 / 備註</label>
                <textarea id="remarks" rows="2" placeholder="例如: 見客、去買公司物資..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">➕ 新增紀錄</button>
        </form>
    </div>

    <div class="card">
        <button class="btn btn-success" onclick="exportToExcel()">📊 匯出 Excel (.xlsx)</button>
        <div class="action-grid">
            <button class="btn btn-secondary" onclick="exportBackup()">📥 備份資料 (JSON)</button>
            <button class="btn btn-secondary" onclick="triggerImport()">📤 還原資料 (Import)</button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importBackup(event)">
    </div>

    <div class="card">
        <h2>📋 歷史紀錄</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>開始/完結里數</th>
                        <th>總距離</th>
                        <th>原因/備註</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="recordTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="version-tag">v1.1.0 (2026-06-09)</div>

<script>
    let records = [];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('driveDate').value = today;
        
        loadRecords();
        setupSmartCalculation();
    });

    // 三向智能聯動計算
    function setupSmartCalculation() {
        const startInput = document.getElementById('startMileage');
        const endInput = document.getElementById('endMileage');
        const totalInput = document.getElementById('totalDistance');

        // 當輸入開始里數
        startInput.addEventListener('input', () => {
            const start = parseFloat(startInput.value);
            const end = parseFloat(endInput.value);
            if (!isNaN(start) && !isNaN(end)) {
                totalInput.value = parseFloat((end - start).toFixed(1));
            }
        });

        // 當輸入完結里數
        endInput.addEventListener('input', () => {
            const start = parseFloat(startInput.value);
            const end = parseFloat(endInput.value);
            const total = parseFloat(totalInput.value);

            if (!isNaN(start) && !isNaN(end)) {
                // 如果開始同完結都有，直接計總距離
                totalInput.value = parseFloat((end - start).toFixed(1));
            } else if (isNaN(start) && !isNaN(end) && !isNaN(total)) {
                // 如果無開始，但有完結同總距離，倒計返開始里數
                startInput.value = parseFloat((end - total).toFixed(1));
            }
        });

        // 當輸入/修改總距離
        totalInput.addEventListener('input', () => {
            const start = parseFloat(startInput.value);
            const end = parseFloat(endInput.value);
            const total = parseFloat(totalInput.value);

            if (!isNaN(end) && !isNaN(total)) {
                // 有完結同總距離 -> 計出開始
                startInput.value = parseFloat((end - total).toFixed(1));
            } else if (!isNaN(start) && !isNaN(total)) {
                // 有開始同總距離 -> 計出完結
                endInput.value = parseFloat((start + total).toFixed(1));
            }
        });
    }

    function saveAndRefresh() {
        localStorage.setItem('mileage_records', JSON.stringify(records));
        renderTable();
    }

    function loadRecords() {
        const stored = localStorage.getItem('mileage_records');
        if (stored) {
            try {
                records = JSON.parse(stored);
                records.sort((a, b) => new Date(b.date) - new Date(a.date));
            } catch (e) {
                records = [];
            }
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('recordTableBody');
        tbody.innerHTML = '';

        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64748b;">暫無紀錄</td></tr>';
            return;
        }

        records.forEach((rec, index) => {
            const tr = document.createElement('tr');
            // 處理留空里數時的顯示
            const startDisp = (rec.start === null || rec.start === '' || isNaN(rec.start)) ? '-' : rec.start;
            const endDisp = (rec.end === null || rec.end === '' || isNaN(rec.end)) ? '-' : rec.end;
            const routeDisp = (startDisp === '-' && endDisp === '-') ? '直接輸入' : `${startDisp} → ${endDisp}`;

            tr.innerHTML = `
                <td>${rec.date}</td>
                <td>${routeDisp}</td>
                <td style="font-weight:bold;color:#16a34a;">${rec.total} km</td>
                <td>${rec.remarks || '-'}</td>
                <td><button class="btn-danger" onclick="deleteRecord(${index})">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('mileageForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const date = document.getElementById('driveDate').value;
        const startVal = document.getElementById('startMileage').value;
        const endVal = document.getElementById('endMileage').value;
        const total = parseFloat(document.getElementById('totalDistance').value);

        const start = startVal !== '' ? parseFloat(startVal) : null;
        const end = endVal !== '' ? parseFloat(endVal) : null;

        // 安全檢查：如果同時有開始同完結里數，保障完結大過開始
        if (start !== null && end !== null && (end - start) < 0) {
            alert('錯誤：完結里數不能少於開始里數！');
            return;
        }
        if (total < 0) {
            alert('錯誤：總行車距離不能為負數！');
            return;
        }

        const remarks = document.getElementById('remarks').value;

        const newRecord = { date, start, end, total, remarks };
        records.unshift(newRecord);
        saveAndRefresh();

        // 表單重置
        document.getElementById('startMileage').value = '';
        document.getElementById('endMileage').value = '';
        document.getElementById('totalDistance').value = '';
        document.getElementById('remarks').value = '';
        
        alert('🎉 紀錄已成功新增！');
    });

    function deleteRecord(index) {
        if (confirm('確定要刪除呢條紀錄嗎？')) {
            records.splice(index, 1);
            saveAndRefresh();
        }
    }

    function exportToExcel() {
        if (records.length === 0) {
            alert('沒有數據可以匯出！');
            return;
        }
        const excelData = records.map(r => ({
            '日期': r.date,
            '開始里數 (km)': (r.start === null || isNaN(r.start)) ? '' : r.start,
            '完結里數 (km)': (r.end === null || isNaN(r.end)) ? '' : r.end,
            '總行車距離 (km)': r.total,
            '長車原因 / 備註': r.remarks
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "行車紀錄");
        
        const todayStr = new Date().toISOString().split('T')[0];
        XLSX.writeFile(workbook, `行車里數紀錄_${todayStr}.xlsx`);
    }

    function exportBackup() {
        if (records.length === 0) {
            alert('沒有數據可以備份！');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        const todayStr = new Date().toISOString().split('T')[0];
        downloadAnchor.setAttribute("download", `mileage_backup_${todayStr}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById('importFileInput').click();
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    if (confirm(`確認匯入？這將會覆蓋現有的 ${records.length} 條紀錄，並載入備份中的 ${importedData.length} 條紀錄。`)) {
                        records = importedData;
                        saveAndRefresh();
                        alert('✅ 資料已成功還原！');
                    }
                } else {
                    alert('失敗：備份檔案格式不正確。');
                }
            } catch (err) {
                alert('失敗：無法讀取此檔案，請確保它是有效的備份 JSON 檔。');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }
</script>

</body>
</html>
